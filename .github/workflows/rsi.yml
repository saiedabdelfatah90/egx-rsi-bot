name: RSI Bot

on:
  schedule:
    - cron: "*/5 7-12 * * 0-4"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rsi-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          pip install pandas requests openpyxl
          pip install git+https://github.com/rongardF/tvdatafeed.git

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python bot.py

      - name: MA200 alert
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python ma200.py

      - name: Patterns
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python patterns.py

      - name: Best picks
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python best.py

      - name: Excel commands
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python excel_cmd.py

      - name: Run commands
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python commands.py
              - name: Levels alert
        run: python levels.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}

      - name: Save state
        if: always()
        run: |
          git config user.name "rsi-bot"
          git config user.email "rsi-bot@users.noreply.github.com"
          for f in state.json trades.json market_data.json.levels.json docs/market_data.json; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --cached --quiet && exit 0
          git commit -m "update state"
          for i in 1 2 3 4; do
            git pull --rebase --autostash && git push && exit 0
            echo "push failed (attempt $i), retrying..."
            sleep $((i * 15))
          done
          echo "could not push state"
          exit 1
