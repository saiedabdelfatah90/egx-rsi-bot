name: Daily Report

on:
  schedule:
    # بعد آخر تشغيل للبوت في اليوم (13:05 UTC)، من الأحد للخميس
    - cron: "5 13 * * 0-4"
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests openpyxl

      - name: Send report
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python daily_report.py
